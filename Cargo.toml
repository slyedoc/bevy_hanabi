[package]
name = "bevy_hanabi"
version = "0.20.0-dev"
authors = ["Jerome Humbert <djeedai@gmail.com>"]
edition = "2021"
rust-version = "1.97.1"
description = "Hanabi GPU particle system for the Bevy game engine"
repository = "https://github.com/djeedai/bevy_hanabi"
homepage = "https://github.com/djeedai/bevy_hanabi"
documentation = "https://docs.rs/bevy_hanabi"
keywords = ["bevy", "particle-system", "particles", "vfx"]
license = "MIT OR Apache-2.0"
readme = "README.md"
exclude = [
  "docs/*.svg",
  "docs/*.png",
  "examples/*.gif",
  "examples/*.png",
  "examples/wasm/*",
  ".github",
  "release.md",
  "build_examples_wasm.bat",
  "build_examples_wasm.sh",
  "run_examples.bat",
  "run_examples.sh",
  "deny.toml",
  "rustfmt.toml.nightly",
]
autoexamples = false

[features]
default = []

# Enable tracing annotations. This is disabled by default for performance.
trace = []

[dependencies]
bytemuck = { version = "1.5", features = ["derive", "must_cast"] }
fixedbitset = "0.5"
rand = "0.10"
rand_pcg = "0.10"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
ron = "0.12"
bitflags = "2.3"
thiserror = "2"

# getrandom requires both 'wasm_js' as a feature AND as a RUSTFLAGS to work on wasm
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", default-features = false, features = [
  "wasm_js",
] }

# Render-free bevy: the fork branch `aurora`, as aurora takes it. aurora draws the effects
# (bevy_aurora::particles); this crate is the effect graph, its Slang and the CPU side.
[dependencies.bevy]
git = "https://github.com/bevyengine/bevy"
branch = "main"
default-features = false
features = [
  "std",
  "bevy_asset",
  "bevy_log",
  "bevy_camera",
  "bevy_image",
  "bevy_mesh",
  "serialize",
  "reflect_auto_register",
]

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
futures = "0.3"

[patch."https://github.com/bevyengine/bevy"]
bevy = { git = "https://github.com/slyedoc/bevy", branch = "aurora" }

[workspace]
resolver = "2"
members = ["."]
